[[mgr.prepend_keymap]]
on = [ "g", "p"]
run = "cd ~/Projects"
desc = "Projects"

[[mgr.prepend_keymap]]
on = [ "g", "d"]
run = "cd ~/.dotfiles"
desc = ".dotfiles"

[[mgr.prepend_keymap]]
on = [ "g", "D"]
run = "cd ~/dotfiles"
desc = "dotfiles"

[[mgr.prepend_keymap]]
on = [ "g", "i"]
run = 'cd "~/Library/Mobile Documents/com~apple~CloudDocs"'
desc = "iCloud"

